name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore
        run: dotnet restore SafetyOps.slnx
      - name: Check formatting
        run: dotnet format SafetyOps.slnx --verify-no-changes --no-restore
      - name: Build (warnings are errors)
        run: dotnet build SafetyOps.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test SafetyOps.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  web:
    name: Web (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safetyops-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safetyops-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type-check (strict) and build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag safetyops:ci .
